<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>豆豆拼豆 · Bead Pattern Studio</title>
<style>
:root{
  --bg:#faf7f4;--card:#ffffff;--card2:#f5f2ee;
  --text:#211f2e;--text2:#6e6a7d;--text3:#a8a4b5;
  --border:#ece8f1;--border2:#f3f0f6;
  --accent:#7c5cff;--accent2:#ff5ca8;--accent3:#ff9f43;--accent-light:#f4effe;
  --board:#f1ece2;--board-line:rgba(120,100,80,.07);
  --danger:#ef4444;--success:#10b981;--warn:#f59e0b;
  --shadow-card:0 2px 10px rgba(40,30,70,.05),0 1px 3px rgba(40,30,70,.04);
  --shadow-lg:0 8px 32px rgba(40,30,70,.10),0 2px 8px rgba(40,30,70,.05);
  --radius:18px;--radius-sm:13px;--radius-xs:10px;
  --transition:.28s cubic-bezier(.4,0,.2,1);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}
[data-theme="dark"]{
  --bg:#15131c;--card:#1f1c29;--card2:#262333;
  --text:#efedf5;--text2:#9d99ad;--text3:#69657b;
  --border:#2c2938;--border2:#24212f;
  --accent:#9b80ff;--accent2:#ff7cba;--accent3:#ffb066;--accent-light:#241f3a;
  --board:#1b1822;--board-line:rgba(255,255,255,.05);
  --shadow-card:0 2px 10px rgba(0,0,0,.4);--shadow-lg:0 8px 32px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);
  min-height:100dvh;line-height:1.5;
  transition:background .3s,color .3s;
  overflow-x:hidden;
  /* Trendy perler-bead floating background */
  background-image:url('bg-beads.png?v=3');
  background-size:cover;background-position:center top;background-repeat:no-repeat;
  background-attachment:fixed;
}
/* Overlay to keep content readable over the decorative bg */
body::before{
  content:'';position:fixed;inset:0;z-index:-1;
  background:rgba(250,247,244,.74);
  pointer-events:none;
  transition:background .3s;
}
body[data-theme="dark"]::before{background:rgba(10,8,20,.42)}
body[data-theme="dark"]{
  background-image:url('bg-beads-dark.png?v=3');
  background-size:cover;background-position:center top;background-repeat:no-repeat;
  background-attachment:fixed;
}
/* On phones, fixed-attachment is ignored/janky on many browsers (esp. iOS Safari) — use scroll so the bg always renders */
@media (max-width:768px){
  body,body[data-theme="dark"]{background-attachment:scroll}
}
/* Ambient floating beads — subtle life, sits above bg image + overlay, below content */
.bg-ambient{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.bg-ambient i{
  position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.85),var(--c) 55%);
  box-shadow:0 0 12px var(--c),inset 0 -2px 4px rgba(0,0,0,.18);
  opacity:.5;animation:beadFloat 9s ease-in-out infinite;animation-delay:var(--d);
}
@keyframes beadFloat{
  0%,100%{transform:translateY(0) rotate(0);opacity:.32}
  50%{transform:translateY(-22px) rotate(8deg);opacity:.6}
}
@media (prefers-reduced-motion:reduce){.bg-ambient{display:none}}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ==================== HEADER ==================== */
.header{
  position:sticky;top:0;z-index:50;
  background:rgba(250,247,244,.72);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  padding:12px 16px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid rgba(124,92,255,.10);
  transition:border-color .3s,background .3s;
}
[data-theme="dark"] .header{background:rgba(21,19,28,.75);border-bottom-color:rgba(155,128,255,.12)}
.header.scrolled{border-bottom-color:var(--border)}
.h-l{display:flex;align-items:center;gap:10px}
.h-logo{
  width:36px;height:36px;border-radius:11px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;font-weight:800;
  box-shadow:0 2px 10px rgba(108,92,231,.25);
}
.h-title{font-size:17px;font-weight:900;letter-spacing:-.03em}
.h-r{display:flex;align-items:center;gap:7px}
.h-btn{
  width:36px;height:36px;border-radius:11px;border:none;background:var(--card);
  display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;
  color:var(--text2);box-shadow:var(--shadow-card);transition:all .3s cubic-bezier(.4,0,.2,1);
  border:1px solid var(--border2);
}
.h-btn:hover{color:var(--accent);border-color:var(--accent)}
.h-btn:active{transform:scale(.9);background:var(--accent-light)}

/* ==================== BRAND PILLS ==================== */
.brand-row{
  display:flex;gap:7px;padding:6px 14px 10px;overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.brand-pill{
  padding:8px 20px;border-radius:24px;font-size:12.5px;font-weight:800;
  border:1.5px solid var(--border);background:var(--card);
  color:var(--text2);cursor:pointer;white-space:nowrap;
  transition:all .3s cubic-bezier(.4,0,.2,1);
  flex-shrink:0;letter-spacing:-.01em;position:relative;overflow:hidden;
}
.brand-pill::before{
  content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--accent),var(--accent2));
  opacity:0;transition:opacity .3s;border-radius:inherit;
}
.brand-pill:hover{border-color:var(--accent);color:var(--text)}
.brand-pill:active{transform:scale(.93)}
.brand-pill.active{
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;
  box-shadow:0 4px 18px rgba(108,92,231,.4),0 0 24px rgba(124,92,255,.15);
}

/* ==================== MAIN CONTENT ==================== */
.main-content{padding:0 14px 100px;display:flex;flex-direction:column;gap:12px}

/* ==================== UPLOAD CARD ==================== */
.upload-card{
  background:var(--card);border-radius:var(--radius);padding:24px 16px;
  border:2.5px dashed var(--border);text-align:center;cursor:pointer;
  transition:all .35s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;
  box-shadow:var(--shadow-card);
  animation:cardPulse 2.6s ease-in-out infinite;
}
/* Calm breathing border — simple, no spinning */
@keyframes cardPulse{
  0%,100%{border-color:var(--border);box-shadow:var(--shadow-card)}
  50%{border-color:var(--accent);box-shadow:0 4px 20px rgba(108,92,231,.14)}
}
.upload-card.has-image,.upload-card:hover,.upload-card.drag-over{animation:none}
.upload-card::before{
  content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:radial-gradient(circle at center,rgba(108,92,231,.03),transparent 70%);
  opacity:0;transition:opacity .4s;
}
.upload-card:hover::before,.upload-card.drag-over::before{opacity:1}
.upload-card:hover,.upload-card.drag-over{border-color:var(--accent);background:var(--accent-light);transform:translateY(-1px)}
.upload-card.has-image{border-style:solid;border-color:var(--border2);padding:10px}
.upload-card.has-image::before{display:none}
.upload-icon-wrap{
  width:60px;height:60px;border-radius:18px;margin:0 auto 14px;
  background:linear-gradient(135deg,rgba(108,92,231,.12),rgba(168,85,247,.18));
  display:flex;align-items:center;justify-content:center;font-size:26px;
  transition:transform .35s cubic-bezier(.34,1.56,.64,1);
}
.upload-card:hover .upload-icon-wrap{transform:scale(1.12) rotate(-5deg)}
.upload-title{font-size:15.5px;font-weight:800;margin-bottom:5px;color:var(--text);letter-spacing:-.01em}
.upload-hint{font-size:11px;color:var(--text3);letter-spacing:.02em}
.upload-preview{
  display:none;width:100%;max-height:140px;object-fit:contain;border-radius:10px;
  box-shadow:0 2px 12px rgba(0,0,0,.06);
}
.upload-card.has-image .upload-preview{display:block}
.upload-card.has-image .upload-icon-wrap,.upload-card.has-image .upload-title,.upload-card.has-image .upload-hint{display:none}
.upload-input{display:none;position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;padding:0}

/* ==================== CANVAS SECTION ==================== */
.canvas-section{
  background:var(--card);border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow-card);min-height:200px;
  display:flex;align-items:center;justify-content:center;position:relative;
  border:1px solid var(--border2);
  transition:box-shadow .35s,transform .35s;
}
.canvas-section:hover{box-shadow:0 6px 28px rgba(124,92,255,.14),var(--shadow-card);transform:translateY(-1px)}
.canvas-empty{text-align:center;padding:44px 20px;color:var(--text3)}
.canvas-empty-icon{font-size:48px;margin-bottom:12px;opacity:.4;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.canvas-empty-text{font-size:14px;font-weight:700;color:var(--text2);margin-bottom:4px}
.canvas-empty-hint{font-size:11px;margin-top:2px;letter-spacing:.03em}
/* Soft glow halo behind empty-state icon for a crafted feel */
.canvas-empty::before{
  content:'';position:absolute;top:34px;left:50%;transform:translateX(-50%);
  width:96px;height:96px;border-radius:50%;
  background:radial-gradient(circle,rgba(124,92,255,.16),transparent 70%);
  pointer-events:none;
}
#beadCanvas{max-width:100%;display:block;margin:0 auto;cursor:crosshair;touch-action:manipulation;border-radius:4px}

/* ==================== QUICK ACTIONS STRIP ==================== */
.quick-strip{
  display:flex;gap:8px;overflow-x:auto;padding:4px 10px;-webkit-overflow-scrolling:touch;
}
.quick-btn{
  display:flex;align-items:center;gap:5px;padding:11px 18px;border-radius:24px;
  font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;
  transition:all .3s cubic-bezier(.34,1.56,.64,1);flex-shrink:0;
  border:1.5px solid var(--border);
  background:var(--card);color:var(--text2);
  position:relative;overflow:hidden;
}
.quick-btn::before{
  content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.15),transparent);
  opacity:0;transition:opacity .3s;
}
.quick-btn:hover::before{opacity:1}
.quick-btn:active{transform:scale(.94)}
/* AI feature buttons - default inactive (subtle) */
.quick-btn.ai-feature{
  background:var(--card2);border-color:var(--border2);
  color:var(--text3);
}
/* AI optimize - purple theme */
.quick-btn.ai-optimize.active{
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  color:#fff;border-color:transparent;
  box-shadow:0 4px 18px rgba(124,58,237,.35), inset 0 1px 0 rgba(255,255,255,.15);
}
.quick-btn.ai-optimize.active::after{
  content:'✓';margin-left:2px;font-size:11px;font-weight:900;
}
/* BG remove - emerald theme */
.quick-btn.ai-bgremove.active{
  background:linear-gradient(135deg,#059669,#10b981);
  color:#fff;border-color:transparent;
  box-shadow:0 4px 18px rgba(16,185,129,.35), inset 0 1px 0 rgba(255,255,255,.15);
}
.quick-btn.ai-bgremove.active::after{
  content:'✓';margin-left:2px;font-size:11px;font-weight:900;
}
/* Regular accent button */
.quick-btn.accent{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;box-shadow:0 3px 14px rgba(108,92,231,.25)}
.quick-btn svg{width:15px;height:15px;flex-shrink:0}

/* ==================== SETTINGS CARD ==================== */
.settings-card{
  background:var(--card);border-radius:var(--radius);padding:16px 18px;
  box-shadow:var(--shadow-card);border:1px solid var(--border2);
  transition:box-shadow .35s,transform .35s;
}
.settings-card:hover{box-shadow:0 6px 28px rgba(124,92,255,.12),var(--shadow-card);transform:translateY(-1px)}
.settings-title{
  font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;
  color:var(--text3);margin-bottom:12px;display:flex;align-items:center;gap:6px;
}
.settings-title::after{content:'';flex:1;height:1px;background:var(--border2);margin-left:8px}
.setting-row{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.setting-row:last-child{margin-bottom:0}
.setting-label{font-size:12.5px;color:var(--text2);white-space:nowrap;min-width:52px;font-weight:600}
.setting-val{font-size:13px;font-weight:800;color:var(--accent);min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
input[type="range"]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:2px;background:var(--border);outline:none;transition:background .2s;border:none;padding:0;margin:10px 0 6px}
input[type="range"]:hover{background:var(--accent)}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;box-shadow:0 1px 4px rgba(108,92,231,.25),0 1px 2px rgba(0,0,0,.06);transition:transform .15s,box-shadow .15s}
input[type="range"]::-webkit-slider-thumb:hover{transform:scale(1.15);box-shadow:0 2px 8px rgba(108,92,231,.35)}
input[type="range"]::-webkit-slider-thumb:active{transform:.92}
input[type="range"]::-moz-range-track{height:4px;border-radius:2px;background:var(--border);border:none}
input[type="range"]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;box-shadow:0 1px 4px rgba(108,92,231,.25)}
.grid-num-input{width:52px;height:30px;border-radius:8px;border:1.5px solid var(--border);background:var(--card2);color:var(--accent);font-size:13px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;outline:none;transition:border-color .2s;flex-shrink:0;padding:0 4px;box-sizing:border-box;-moz-appearance:textfield}
.grid-num-input::-webkit-inner-spin-button{-webkit-appearance:none}
.grid-num-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(108,92,231,.15)}

/* ==================== SCHEME PILLS ==================== */
.scheme-strip{
  display:flex;gap:7px;overflow-x:auto;padding:4px 10px 10px;-webkit-overflow-scrolling:touch;
}
.scheme-pill{
  display:flex;align-items:center;gap:5px;padding:9px 15px;border-radius:22px;
  font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap;
  border:1.5px solid var(--border);background:var(--card);color:var(--text2);
  transition:all .3s cubic-bezier(.34,1.56,.64,1);flex-shrink:0;
}
.scheme-pill:hover{border-color:var(--accent);background:var(--accent-light)}
.scheme-pill:active{transform:scale(.93)}
.scheme-pill.active{border-color:var(--accent);background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 3px 14px rgba(108,92,231,.32)}
.scheme-dots{display:flex;gap:2.5px}
.scheme-dots span{width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1)}

/* ==================== DISPLAY TOGGLES ==================== */
.toggle-strip{display:flex;gap:8px;overflow-x:auto;padding:4px 10px 8px}
.toggle-chip{
  display:flex;align-items:center;gap:6px;padding:9px 17px;border-radius:22px;
  font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap;
  border:1.5px solid var(--border);background:var(--card);color:var(--text3);
  transition:all .3s cubic-bezier(.34,1.56,.64,1);flex-shrink:0;
}
.toggle-chip:hover{border-color:var(--accent);color:var(--text2)}
.toggle-chip:active{transform:scale(.93)}
.toggle-chip.active{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;border-color:transparent;
  box-shadow:0 3px 14px rgba(108,92,231,.3);
}
.toggle-dot{width:8px;height:8px;border-radius:50%;background:currentColor;transition:all .3s}

/* ==================== COLOR LIST ==================== */
.color-section{background:var(--card);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-card);border:1px solid var(--border2)}
.color-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.color-stats{display:flex;gap:20px;font-size:11.5px;color:var(--text2)}
.color-stats b{color:var(--text);font-size:15px;font-weight:800}
.color-scroll{display:flex;gap:10px;overflow-x:auto;padding:6px 0 4px;-webkit-overflow-scrolling:touch}
.color-chip{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:14px 16px;border-radius:16px;cursor:pointer;
  border:2px solid transparent;background:var(--card2);
  transition:all .3s cubic-bezier(.4,0,.2,1);flex-shrink:0;min-width:64px;
}
.color-chip:hover{border-color:var(--border);transform:translateY(-3px) scale(1.02);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.color-chip:active{transform:scale(.94)}
.color-chip.active{
  border-color:var(--accent);background:linear-gradient(180deg,var(--accent-light),transparent);
  box-shadow:0 4px 20px rgba(108,92,237,.18),0 0 30px rgba(124,92,255,.06);
}
.chip-swatch{
  width:36px;height:36px;border-radius:50%;
  box-shadow:inset 0 2px 4px rgba(255,255,255,.2),inset 0 -2px 4px rgba(0,0,0,.12),0 3px 10px rgba(0,0,0,.1);
  transition:transform .25s cubic-bezier(.34,1.56,.64,1);
}
.color-chip:hover .chip-swatch{transform:scale(1.12)}
.chip-code{font-size:11px;font-weight:800;color:var(--text);letter-spacing:.02em}
.chip-count{font-size:10.5px;color:var(--text3);font-weight:700}
.color-chip.active .chip-code{color:var(--accent)}

/* ==================== ACTION BAR ==================== */
.action-bar{
  display:flex;gap:10px;position:fixed;bottom:0;left:0;right:0;z-index:40;
  padding:12px 14px;padding-bottom:max(12px,env(safe-area-inset-bottom));
  background:rgba(245,243,240,.92);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  border-top:1px solid var(--border);
}
[data-theme="dark"] .action-bar{background:rgba(18,18,18,.92)}
.action-btn{
  flex:1;padding:15px 12px;border-radius:16px;font-size:14px;font-weight:800;
  cursor:pointer;border:none;transition:all .3s cubic-bezier(.4,0,.2,1);display:flex;
  align-items:center;justify-content:center;gap:7px;min-width:0;letter-spacing:-.01em;
  position:relative;overflow:hidden;
}
.action-btn::before{
  content:'';position:absolute;top:0;left:0;right:0;height:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.12),transparent);
  opacity:0;transition:opacity .3s;
}
.action-btn:hover::before{opacity:1}
.action-btn:active{transform:scale(.96)}
.btn-export{
  background:linear-gradient(180deg,var(--card),var(--card2));color:var(--text);
  border:1.5px solid var(--border);box-shadow:0 2px 10px rgba(0,0,0,.05);
}
.btn-export:hover{border-color:var(--accent);background:var(--accent-light)}
.btn-share{
  background:linear-gradient(135deg,var(--accent),var(--accent2),var(--accent3));color:#fff;
  box-shadow:0 5px 24px rgba(108,92,237,.4),0 0 40px rgba(124,92,255,.1);
}

/* ==================== EDIT PALETTE OVERLAY ==================== */
.edit-bar{
  display:none;align-items:center;gap:7px;padding:6px 12px;overflow-x:auto;
}
.edit-bar.show{display:flex}
.edit-swatch{
  width:26px;height:26px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;
  flex-shrink:0;transition:all .25s cubic-bezier(.4,0,.2,1);
  box-shadow:0 2px 6px rgba(0,0,0,.1), inset 0 1px 3px rgba(255,255,255,.3);
}
.edit-swatch:hover{transform:scale(1.15)}
.edit-swatch:active{transform:scale(.9)}
.edit-swatch.active{border-color:var(--accent);transform:scale(1.2);box-shadow:0 0 0 4px var(--accent-light),0 4px 12px rgba(108,92,231,.15)}

/* ==================== PROCESSING ==================== */
.proc-overlay{
  position:absolute;inset:0;background:rgba(245,243,240,.7);
  display:flex;align-items:center;justify-content:center;z-index:5;
  opacity:0;pointer-events:none;transition:opacity .3s;
  backdrop-filter:blur(2px);
}
[data-theme="dark"] .proc-overlay{background:rgba(18,18,18,.7)}
.proc-overlay.active{opacity:1;pointer-events:all}
.proc-spinner{
  width:36px;height:36px;border-radius:50%;border:3px solid var(--border);
  border-top-color:var(--accent);animation:spin .75s linear infinite;
  box-shadow:0 2px 12px rgba(108,92,231,.15);
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ==================== TOAST ==================== */
.toast{
  position:fixed;top:76px;left:50%;transform:translateX(-50%) translateY(-12px);
  background:var(--card);border:1px solid var(--border);border-radius:24px;
  padding:11px 26px;box-shadow:0 10px 40px rgba(0,0,0,.1),0 3px 10px rgba(108,92,231,.08),0 2px 6px rgba(0,0,0,.04);
  font-size:12.5px;font-weight:700;z-index:100;opacity:0;pointer-events:none;
  transition:all .4s cubic-bezier(.34,1.56,.64,1);letter-spacing:.01em;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ==================== SHARE SHEET ==================== */
.share-sheet{
  position:fixed;inset:0;z-index:200;display:none;align-items:flex-end;
}
.share-sheet.open{display:flex}
.share-bg{position:absolute;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px)}
.share-panel{
  position:relative;background:var(--card);border-radius:24px 24px 0 0;
  padding:26px 18px;padding-bottom:max(26px,env(safe-area-inset-bottom));
  width:100%;max-width:500px;margin:0 auto;
  box-shadow:0 -10px 50px rgba(0,0,0,.15),0 -2px 12px rgba(108,92,231,.06);
  animation:slideUp .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.share-panel-title{font-size:16px;font-weight:900;text-align:center;margin-bottom:20px;letter-spacing:-.02em}
.share-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.share-item{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:18px 10px;border-radius:18px;cursor:pointer;
  border:1.5px solid var(--border2);background:var(--card2);
  transition:all .3s cubic-bezier(.34,1.56,.64,1);
}
.share-item:hover{border-color:var(--accent);background:var(--accent-light);transform:translateY(-2px)}
.share-item:active{transform:scale(.95);background:var(--accent-light)}
.share-item-icon{
  width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,var(--accent-light),rgba(108,92,231,.12));
  display:flex;align-items:center;justify-content:center;font-size:22px;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1);
}
.share-item:hover .share-item-icon{transform:scale(1.08) rotate(-3deg)}
.share-item-label{font-size:11.5px;font-weight:700;color:var(--text)}
.share-cancel-btn{
  width:100%;padding:14px;border-radius:14px;border:none;
  background:var(--card2);font-size:15px;font-weight:700;cursor:pointer;color:var(--text2);
  border:1.5px solid var(--border2);transition:all .2s;
}
.share-cancel-btn:active{background:var(--border);transform:scale(.99)}

/* ==================== PIXEL BEAD LOGO ==================== */
.h-logo{
  width:38px;height:38px;border-radius:12px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 12px rgba(124,92,255,.32);
  position:relative;overflow:hidden;flex-shrink:0;
  animation:logoPulse 3s ease-in-out infinite;
}
@keyframes logoPulse{0%,100%{box-shadow:0 3px 12px rgba(124,92,255,.32)}50%{box-shadow:0 3px 20px rgba(124,92,255,.55),0 0 24px rgba(124,92,255,.15)}}
.h-logo circle{transform-origin:18px 18px;transition:transform .3s ease}
.h-logo:hover circle{transform:scale(1.1)}
.h-title{font-size:18px;font-weight:900;letter-spacing:-.03em;display:flex;flex-direction:column;line-height:1.05;background:linear-gradient(135deg,var(--accent),var(--accent2),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.h-title small{font-size:9px;font-weight:600;color:var(--text3);letter-spacing:.18em;text-transform:uppercase;-webkit-text-fill-color:var(--text3)}

/* ==================== SIZE PRESET ROW ==================== */
.preset-row{display:flex;gap:6px;overflow-x:auto;padding:4px 10px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.preset-chip{
  display:flex;align-items:center;justify-content:center;gap:1px;padding:10px 16px;border-radius:14px;
  font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap;transition:all .3s cubic-bezier(.34,1.56,.64,1);flex-shrink:0;
  border:1.5px solid var(--border);background:var(--card2);color:var(--text2);line-height:1;
}
.preset-chip:active{transform:scale(.88)}
.preset-chip.active{
  background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;
  box-shadow:0 4px 16px rgba(124,92,255,.35),0 0 20px rgba(124,92,255,.12);
  transform:scale(1.04);
}

/* ==================== CANVAS TOOLBAR ==================== */
.canvas-toolbar{
  display:none;align-items:center;gap:4px;padding:8px 12px 6px 20px;
  background:linear-gradient(180deg,var(--card),var(--card2));
  border-bottom:1px solid var(--border2);overflow-x:auto;-webkit-overflow-scrolling:touch;
  position:relative;z-index:10;border-radius:var(--radius) var(--radius) 0 0;
}
.canvas-section.has-grid .canvas-toolbar{display:flex}
.canvas-toolbar::-webkit-scrollbar{display:none}
.tb-sep{width:1px;height:20px;background:var(--border2);flex-shrink:0;margin:0 1px}
.tb-label{font-size:10px;font-weight:700;color:var(--text3);white-space:nowrap;padding-right:2px}
.tool-btn{
  width:34px;height:34px;border-radius:10px;flex-shrink:0;
  border:1.5px solid var(--border);background:var(--card);
  display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;
  color:var(--text2);transition:all .25s cubic-bezier(.4,0,.2,1);position:relative;
}
.tool-btn:hover{border-color:var(--accent);color:var(--text);transform:translateY(-1px)}
.tool-btn:active{transform:scale(.9)}
.tool-btn.active{
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;
  box-shadow:0 3px 14px rgba(124,92,255,.38);
}
.tool-btn.active::after{content:'';position:absolute;bottom:3px;width:14px;height:3px;border-radius:2px;background:rgba(255,255,255,.9)}
.tb-spacer{flex:1}
.tool-btn.ghost{background:transparent;border-color:transparent;color:var(--text3)}

/* Zoom percentage display pill — prominent, clearly separated from +/− */
.zoom-pill{
  min-width:50px;height:30px;padding:0 9px;border-radius:9px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 2px 8px rgba(124,92,255,.28),inset 0 1px 0 rgba(255,255,255,.15);
  font-variant-numeric:tabular-nums;
}
.zoom-pill-val{font-size:12px;font-weight:800;letter-spacing:-.01em;line-height:1}
.zoom-pill.light{background:rgba(255,255,255,.12);box-shadow:0 2px 8px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.08)}

/* Reset button — visually distinct from zoom in/out, sits separately */
.tool-btn.reset, .pz-btn.reset{
  width:34px;height:34px;font-size:16px;color:var(--accent);
  background:var(--accent-light);border-color:transparent;
  box-shadow:0 1px 4px rgba(124,92,255,.15);
}
.tool-btn.reset:hover, .pz-btn.reset:hover{
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;
  box-shadow:0 3px 10px rgba(124,92,255,.32);
}

/* ==================== PEG BOARD CANVAS ==================== */
.canvas-section{
  background:var(--board);border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow-card);min-height:220px;min-width:0;
  display:flex;flex-direction:column;position:relative;border:1px solid var(--border2);
}
.canvas-stage{
  flex:1;display:flex;padding:14px;position:relative;min-height:180px;
  min-width:0;max-width:100%;max-height:65vh;overflow:auto;width:100%;-webkit-overflow-scrolling:touch;
  background:
    radial-gradient(circle at 50% 40%,rgba(255,255,255,.5),transparent 70%),
    repeating-linear-gradient(0deg,transparent,transparent 11px,var(--board-line) 11px,var(--board-line) 12px),
    repeating-linear-gradient(90deg,transparent,transparent 11px,var(--board-line) 11px,var(--board-line) 12px);
}
#beadCanvas{display:none;max-width:100%;margin:auto;cursor:crosshair;touch-action:manipulation;border-radius:3px;box-shadow:0 2px 14px rgba(40,30,70,.12);position:relative;z-index:2}
.canvas-empty{text-align:center;padding:40px 20px;color:var(--text3);position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1;pointer-events:auto;width:100%;box-sizing:border-box}
.canvas-empty-icon{font-size:48px;margin-bottom:12px;opacity:.5;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 2px 8px rgba(108,92,231,.15))}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.canvas-empty-text{font-size:15px;font-weight:800;color:var(--text2);margin-bottom:4px;white-space:nowrap}
.canvas-empty-hint{font-size:11.5px;margin-top:3px;letter-spacing:.02em;white-space:nowrap;color:var(--text3)}
.canvas-empty-hint b{color:var(--accent);font-weight:800}

/* ==================== PREVIEW MODE ==================== */
body.preview-mode .header,body.preview-mode .brand-row,
body.preview-mode .main-content>*:not(.canvas-section),
body.preview-mode .action-bar{display:none!important}
body.preview-mode{overflow:hidden}
body.preview-mode .main-content{padding:0;gap:0;margin:0}
body.preview-mode .canvas-section{position:fixed;inset:0;z-index:500;border-radius:0;border:none;min-height:100dvh;background:var(--board)}
body.preview-mode .canvas-toolbar{background:rgba(255,255,255,.9);backdrop-filter:blur(12px)}
body.preview-mode .canvas-stage{min-height:100dvh}
.preview-badge{
  position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:600;
  background:rgba(33,31,46,.85);color:#fff;font-size:11px;font-weight:600;
  padding:6px 14px;border-radius:20px;display:none;align-items:center;gap:6px;backdrop-filter:blur(8px);
  cursor:pointer;
}
/* In preview mode the bar below replaces the badge */
body.preview-mode .preview-badge{display:none}

/* ==================== PREVIEW EXIT BAR ==================== */
/* Clear, obvious exit control sitting ABOVE the bead image */
.preview-exit{
  position:fixed;top:0;left:0;right:0;z-index:610;
  display:none;align-items:center;justify-content:space-between;
  padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));
  background:rgba(33,31,46,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,.08);
}
body.preview-mode .preview-exit{display:flex}
body.preview-mode .canvas-toolbar{display:none}
body.preview-mode .canvas-stage{padding-top:64px;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom}
.preview-exit .pe-left{display:flex;align-items:center;gap:8px}
.preview-exit .pe-title{font-size:14px;font-weight:800;color:#fff;display:flex;align-items:center;gap:7px;letter-spacing:-.01em}
/* Zoom controls in preview bar */
.preview-zoom{display:flex;align-items:center;gap:6px;margin-left:6px}
.pz-btn{
  width:32px;height:32px;border-radius:10px;border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.1);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;
  transition:all .2s;flex-shrink:0;
}
.pz-btn:active{transform:scale(.9);background:rgba(255,255,255,.2)}
.pz-level{font-size:11px;font-weight:700;color:rgba(255,255,255,.65);min-width:32px;text-align:center;white-space:nowrap}
.preview-exit .pe-right{display:flex;align-items:center;gap:8px}
.preview-exit .pe-btn{
  display:flex;align-items:center;gap:6px;padding:9px 20px;border-radius:22px;border:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  font-size:13.5px;font-weight:800;cursor:pointer;white-space:nowrap;
  box-shadow:0 3px 16px rgba(124,92,255,.45);
}
.preview-exit .pe-btn:active{transform:scale(.95)}

/* ==================== STEP HINT (UPLOAD OVERLAY) ==================== */
.step-hint{display:flex;gap:8px;justify-content:center;margin-top:14px}
.step-dot{display:flex;align-items:center;gap:5px;font-size:9.5px;font-weight:700;color:var(--text3);letter-spacing:.02em;padding:4px 10px;border-radius:10px;background:var(--card2);transition:all .3s}
.step-dot i{width:7px;height:7px;border-radius:50%;background:var(--border);display:inline-block;transition:all .3s}
.step-dot.on i{background:var(--accent);box-shadow:0 0 8px rgba(124,92,255,.5)}
.step-dot.on{color:var(--accent);background:rgba(124,92,255,.08)}

/* ==================== RESPONSIVE (DESKTOP) ==================== */
@media(min-width:768px){
  .main-content{max-width:500px;margin:0 auto}
  .header{justify-content:center;gap:16px}
  .canvas-section{min-height:340px}
}
</style>
</head>

</div>

<!-- HEADER -->

function hexToRgb(h){const m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h);return m?{r:parseInt(m[1],16),g:parseInt(m[2],16),b:parseInt(m[3],16)}:null;}
function clamp(v,min,max){return Math.max(min,Math.min(max,v));}
// Simple Euclidean RGB distance (matches reference site algorithm)
function colorDist(c1,c2){
  // Weighted RGB distance (compuphase) — matches human visual perception,
  // so saturated palette colors are preferred over desaturated "close" grays.
  const dr=c1.r-c2.r,dg=c1.g-c2.g,db=c1.b-c2.b;
  return Math.sqrt(2*dr*dr+4*dg*dg+3*db*db);
}

function isDark(c){return(0.299*c.r+0.587*c.g+0.114*c.b)<140;}
function lighten(c,a){return`rgb(${clamp(c.r+a,0,255)},${clamp(c.g+a,0,255)},${clamp(c.b+a,0,255)})`;}
function darken(c,a){return`rgb(${clamp(c.r-a,0,255)},${clamp(c.g-a,0,255)},${clamp(c.b-a,0,255)})`;}

      lctx.drawImage(img,0,0);

        // Always compute BOTH dimensions from the image to preserve aspect ratio
        if(S.originalRatio>=1){
          S.gridW=Math.min(m,Math.round(img.width/15));
          S.gridH=Math.round(S.gridW/S.originalRatio);
        }else{
          S.gridH=Math.min(m,Math.round(img.height/15));
          S.gridW=Math.round(S.gridH*S.originalRatio);
        }
        // Clamp to valid range
        S.gridW=Math.max(8,Math.min(m,S.gridW));
        S.gridH=Math.max(8,Math.min(m,S.gridH));
        D.gridW.value=S.gridW;D.gridH.value=S.gridH;D.gwVal.value=S.gridW;D.ghVal.value=S.gridH;
      }
      S.imageLoaded=true;
      D.uploadPreview.src=e.target.result;D.uploadCard.classList.add('has-image');
      D.canvasEmpty.style.display='none';D.beadCanvas.style.display='block';D.canvasSection.classList.add('has-grid');setPresetActive();
      $('#btnOptimize').classList.add('active');
      processImage();toast('✨ AI 已自动简化 · 生成拼豆图');
    };
    img.src=e.target.result;
  };
  r.readAsDataURL(file);
}

// =============================================
// AI OPTIMIZE
// =============================================
function aiOptimize(imageData){
  const data=new Uint8ClampedArray(imageData.data),w=imageData.width,h=imageData.height,len=data.length;
  let mn=[255,255,255],mx=[0,0,0];
  for(let i=0;i<len;i+=4){for(let c=0;c<3;c++){mn[c]=Math.min(mn[c],data[i+c]);mx[c]=Math.max(mx[c],data[i+c]);}}
  for(let i=0;i<len;i+=4){for(let c=0;c<3;c++){const rng=mx[c]-mn[c]||1;data[i+c]=((data[i+c]-mn[c])/rng)*255;}}
  const sharp=new Uint8ClampedArray(data);
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const idx=(y*w+x)*4;for(let c=0;c<3;c++){const v=data[idx+c]*5-data[((y-1)*w+x)*4+c]-data[((y+1)*w+x)*4+c]-data[(y*w+(x-1))*4+c]-data[(y*w+(x+1))*4+c];sharp[idx+c]=clamp(v,0,255);}}
  for(let i=0;i<len;i+=4){const r=sharp[i],g=sharp[i+1],b=sharp[i+2];const gray=0.299*r+0.587*g+0.114*b;sharp[i]=clamp(gray+(r-gray)*1.2,0,255);sharp[i+1]=clamp(gray+(g-gray)*1.2,0,255);sharp[i+2]=clamp(gray+(b-gray)*1.2,0,255);}
  return new ImageData(sharp,w,h);
}

// AI 简化：让照片更适合转拼豆（自动预处理）。均值模糊去噪 → 对比度拉伸 → 饱和度提升
function aiSimplify(imageData){
  const src=imageData.data,w=imageData.width,h=imageData.height,len=src.length;
  const blur=new Uint8ClampedArray(src);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;let r=0,g=0,b=0,n=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const nx=x+dx,ny=y+dy;if(nx<0||nx>=w||ny<0||ny>=h)continue;const j=(ny*w+nx)*4;r+=src[j];g+=src[j+1];b+=src[j+2];n++;}blur[i]=r/n;blur[i+1]=g/n;blur[i+2]=b/n;blur[i+3]=src[i+3];}
  let mn=[255,255,255],mx=[0,0,0];
  for(let i=0;i<len;i+=4)for(let c=0;c<3;c++){const v=blur[i+c];if(v<mn[c])mn[c]=v;if(v>mx[c])mx[c]=v;}
  const out=new Uint8ClampedArray(blur);
  for(let i=0;i<len;i+=4)for(let c=0;c<3;c++){const rng=mx[c]-mn[c]||1;out[i+c]=((blur[i+c]-mn[c])/rng)*255;}
  for(let i=0;i<len;i+=4){const r=out[i],g=out[i+1],b=out[i+2];const gray=0.299*r+0.587*g+0.114*b;out[i]=clamp(gray+(r-gray)*1.2,0,255);out[i+1]=clamp(gray+(g-gray)*1.2,0,255);out[i+2]=clamp(gray+(b-gray)*1.2,0,255);}
  return new ImageData(out,w,h);
}

// 统一处理管线：依据 aiOptimized / bgRemoved 两个开关重算 processedData（两者可独立开关、互不覆盖）
function applyPipeline(){
  const base=S.aiOptimized?aiSimplify(S.imageData):S.imageData;
  S.processedData=S.bgRemoved?removeBackground(base):base;
  processImage();
}

// =============================================
// AI BACKGROUND REMOVAL
// =============================================
function removeBackground(imageData){
  const data=new Uint8ClampedArray(imageData.data),w=imageData.width,h=imageData.height;
  const result=new Uint8ClampedArray(data);
  // Edge-based flood fill: pixels near edges with low variance = background
  const visited=new Uint8Array(w*h),bgMask=new Uint8Array(w*h);
  const queue=[];
  const tolerance=35;

  // Seed from all 4 edges
  for(let x=0;x<w;x++){
    const idx=(0*w+x)*4;if(data[idx+3]>0){queue.push(x,0);queue.push(x,h-1);}
  }
  for(let y=0;y<h;y++){
    const idx=(y*w+0)*4;if(data[idx+3]>0){queue.push(0,y);queue.push(w-1,y);}
  }

  // BFS flood fill from edges
  let qi=0;
  while(qi<queue.length){
    const gx=queue[qi++],gy=queue[qi++];
    const key=gy*w+gx;
    if(gx<0||gx>=w||gy<0||gy>=h||visited[key])continue;
    visited[key]=1;
    const ci=(gy*w+gx)*4;
    const cr=data[ci],cg=data[ci+1],cb=data[ci+2];
    // Check if edge pixel is similar to current
    let isBg=true;
    for(const[dx,dy]of[[0,1],[0,-1],[1,0],[-1,0]]){
      const nx=gx+dx,ny=gy+dy;
      if(nx<0||nx>=w||ny<0||ny>=h)continue;
      const ni=(ny*w+nx)*4;
      if(visited[ny*w+nx]){
        const dr=Math.abs(cr-data[ni]),dg=Math.abs(cg-data[ni+1]),db=Math.abs(cb-data[ni+2]);
        if(dr>tolerance||dg>tolerance||db>tolerance){isBg=false;break;}
      }
    }
    if(isBg){
      bgMask[key]=1;
      for(const[dx,dy]of[[0,1],[0,-1],[1,0],[-1,0]]){
        const nx=gx+dx,ny=gy+dy;
        if(nx>=0&&nx<w&&ny>=0&&ny<h&&!visited[ny*w+nx]){queue.push(nx,ny);}
      }
    }
  }

  // Expand flood fill more aggressively from known bg pixels
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    if(!bgMask[y*w+x])continue;
    const ci=(y*w+x)*4;
    for(const[dx,dy]of[[0,1],[1,0],[0,-1],[-1,0]]){
      const nx=x+dx,ny=y+dy;
      if(nx<0||nx>=w||ny<0||ny>=h||bgMask[ny*w+nx])continue;
      const ni=(ny*w+nx)*4;
      const dr=Math.abs(data[ci]-data[ni]),dg=Math.abs(data[ci+1]-data[ni+1]),db=Math.abs(data[ci+2]-data[ni+2]);
      if(dr<tolerance&&dg<tolerance&&db<tolerance)bgMask[ny*w+nx]=1;
    }
  }

  // Apply: set background pixels to pure white
  for(let i=0;i<w*h;i++){
    if(bgMask[i]){const idx=i*4;result[idx]=255;result[idx+1]=255;result[idx+2]=255;}
  }

  return new ImageData(result,w,h);
}

// =============================================
// MEDIAN CUT
// =============================================
function medianCut(pixels,k){
  class Box{
    constructor(cs){this.cs=cs;this.r=[255,0];this.g=[255,0];this.b=[255,0];
      for(const c of cs){this.r[0]=Math.min(this.r[0],c.r);this.r[1]=Math.max(this.r[1],c.r);this.g[0]=Math.min(this.g[0],c.g);this.g[1]=Math.max(this.g[1],c.g);this.b[0]=Math.min(this.b[0],c.b);this.b[1]=Math.max(this.b[1],c.b);}}
    get rr(){return this.r[1]-this.r[0]}get gr(){return this.g[1]-this.g[0]}get br(){return this.b[1]-this.b[0]}
    get sz(){return this.cs.length}
    avg(){if(!this.cs.length)return{r:0,g:0,b:0};let sr=0,sg=0,sb=0;for(const c of this.cs){sr+=c.r;sg+=c.g;sb+=c.b;}const n=this.cs.length;return{r:Math.round(sr/n),g:Math.round(sg/n),b:Math.round(sb/n)};}
    split(){if(this.cs.length<=1)return[this,null];const d=this.rr>=this.gr&&this.rr>=this.br?'r':this.gr>=this.br?'g':'b';const s=[...this.cs].sort((a,b)=>a[d]-b[d]),m=Math.floor(s.length/2);return[new Box(s.slice(0,m)),new Box(s.slice(m))];}
  }
  let boxes=[new Box(pixels)];
  while(boxes.length<k){let mr=-1,mi=0;for(let i=0;i<boxes.length;i++){const b=boxes[i],r=Math.max(b.rr,b.gr,b.br);if(r>mr&&b.sz>1){mr=r;mi=i;}}if(mr===0)break;const[a,b]=boxes[mi].split();boxes.splice(mi,1,a);if(b)boxes.push(b);}
  return boxes.map(b=>b.avg());
}

function applyScheme(colors,s){
  switch(s){
    case'vibrant':return colors.map(c=>({r:clamp(Math.round(c.r*1.3),0,255),g:clamp(Math.round(c.g*1.3),0,255),b:clamp(Math.round(c.b*1.3),0,255)}));
    case'pastel':return colors.map(c=>({r:clamp(Math.round(210+c.r*0.18),0,255),g:clamp(Math.round(210+c.g*0.18),0,255),b:clamp(Math.round(210+c.b*0.18),0,255)}));
    case'warm':return colors.map(c=>{const g=0.299*c.r+0.587*c.g+0.114*c.b;return{r:clamp(Math.round(c.r*1.1+g*.1),0,255),g:clamp(Math.round(c.g*.7),0,255),b:clamp(Math.round(c.b*.5),0,255)};});
    case'cool':return colors.map(c=>{const g=0.299*c.r+0.587*c.g+0.114*c.b;return{r:clamp(Math.round(c.r*.5),0,255),g:clamp(Math.round(c.g*.85),0,255),b:clamp(Math.round(c.b*1.15+g*.05),0,255)};});
    case'retro':return colors.map(c=>{const g=0.299*c.r+0.587*c.g+0.114*c.b;return{r:clamp(Math.round(c.r*.9+g*.1+10),0,255),g:clamp(Math.round(c.g*.7+g*.05+5),0,255),b:clamp(Math.round(c.b*.6+g*.05),0,255)};});
    case'neon':return colors.map(c=>({r:c.r>128?255:clamp(Math.round(c.r*1.5),0,255),g:c.g>128?255:clamp(Math.round(c.g*1.5),0,255),b:c.b>128?255:clamp(Math.round(c.b*1.5),0,255)}));
    case'mono':return colors.map(c=>{const g=Math.round(0.299*c.r+0.587*c.g+0.114*c.b);return{r:g,g:g,b:g};});
    default:return[...colors];
  }
}

// =============================================
// PROCESS
// =============================================
function findClosestBead(px,pal,maxColors){
  const limit=maxColors&&maxColors<pal.length?maxColors:pal.length;
  let md=Infinity,mi=0;
  for(let i=0;i<limit;i++){const c=hexToRgb(pal[i].hex);if(!c)continue;const d=colorDist(px,c);if(d<md){md=d;mi=i;}}
  return mi;
}
function processImage(){
  if(!S.imageData)return;
  setProcessing(true);
  setTimeout(()=>{
    try{
      const wd=S.processedData||S.imageData,gw=S.gridW,gh=S.gridH;
      const palette=getPalette(S.brand);

      // Step 1: Point sampling — draw image at exact grid size, read pixels directly
      // This preserves maximum color accuracy (no averaging blur)
      const tmpC=document.createElement('canvas');tmpC.width=gw;tmpC.height=gh;
      const tmpCtx=tmpC.getContext('2d');
      tmpCtx.imageSmoothingEnabled=false; // CRITICAL: point sampling, not smoothing
      const srcC=document.createElement('canvas');srcC.width=wd.width;srcC.height=wd.height;
      srcC.getContext('2d').putImageData(wd,0,0);
      tmpCtx.drawImage(srcC,0,0,gw,gh);
      const gridData=tmpCtx.getImageData(0,0,gw,gh);

      // Step 2: Direct palette matching — each pixel goes straight to closest brand color
      // NO intermediate quantization (this is the key to reference site quality)
      const beadGrid=new Array(gh),cnts={};
      for(let gy=0;gy<gh;gy++){beadGrid[gy]=new Array(gw);
        for(let gx=0;gx<gw;gx++){
          const idx=(gy*gw+gx)*4;
          const px={r:gridData.data[idx],g:gridData.data[idx+1],b:gridData.data[idx+2]};
          // Optional: apply AI scheme transform before matching
          const col=S.colorScheme?applyScheme([px],S.colorScheme)[0]:px;
          const bi=findClosestBead(col,palette,S.colorCount);
          beadGrid[gy][gx]=bi;cnts[bi]=(cnts[bi]||0)+1;
        }
      }

      // Step 3: Optional color merge (if tolerance > 0)
      if(S.tolerance>0){
        const threshold=S.tolerance*3; // scale slider to color distance
        const usedIdx=Object.keys(cnts).map(Number);
        const mergeMap=new Map();
        usedIdx.forEach(i=>mergeMap.set(i,i));
        const processed=new Set();
        for(const i of usedIdx){
          if(processed.has(i))continue;
          const c1=hexToRgb(palette[i].hex);if(!c1)continue;
          for(const j of usedIdx){
            if(i===j||processed.has(j))continue;
            const c2=hexToRgb(palette[j].hex);if(!c2)continue;
            if(colorDist(c1,c2)<=threshold){mergeMap.set(j,i);processed.add(j);}
          }
          processed.add(i);
        }
        // Apply merge
        const mergedCnts={};
        for(let gy=0;gy<gh;gy++)for(let gx=0;gx<gw;gx++){
          const bi=mergeMap.get(beadGrid[gy][gx]);
          beadGrid[gy][gx]=bi;mergedCnts[bi]=(mergedCnts[bi]||0)+1;
        }
        // Rebuild counts
        Object.assign(cnts,{});
        for(let gy=0;gy<gh;gy++)for(let gx=0;gx<gw;gx++){cnts[beadGrid[gy][gx]]=(cnts[beadGrid[gy][gx]]||0)+1;}
      }

      S.beadColors=palette.map((c,i)=>({code:c.code,name:c.name,hex:c.hex,count:cnts[i]||0}))
        .filter(c=>c.count>0).sort((a,b)=>b.count-a.count);
      S.beadGrid=beadGrid;
      renderCanvas();updateColorList();updateStats();
      pushUndo();
    }catch(e){console.error(e);toast('处理出错');}
    setProcessing(false);
  },20);
}

// =============================================
// UNDO
// =============================================
function pushUndo(){
  if(!S.beadGrid)return;
  const s=S.beadGrid.map(r=>[...r]);S.undoStack=S.undoStack.slice(0,S.undoIdx+1);S.undoStack.push(s);
  if(S.undoStack.length>30)S.undoStack.shift();S.undoIdx=S.undoStack.length-1;
}
function undo(){
  if(S.undoIdx<=0)return;S.undoIdx--;
  S.beadGrid=S.undoStack[S.undoIdx].map(r=>[...r]);recalcAfterEdit();
  renderCanvas();updateColorList();updateStats();
}

// =============================================
// RENDER CANVAS — Square cells (matches reference site)
// =============================================
function getCellSize(){
  const gw=S.gridW,gh=S.gridH,stage=D.canvasStage;
  const availW=Math.max(40,stage.clientWidth-28),availH=Math.max(40,stage.clientHeight-28);
  let cs=Math.max(2,Math.min(30,Math.floor(Math.min(availW/gw,availH/gh))));
  // In MAIN view only: cap canvas physical size so 104/156钉 doesn't stretch the page
  // on mobile. Preview mode is allowed to expand fully.
  if(!document.body.classList.contains('preview-mode')){
    const MAX_DIM=320;
    const maxCsByDim=Math.max(2,Math.floor(MAX_DIM/Math.max(gw,gh)));
    if(cs>maxCsByDim) cs=maxCsByDim;
  }
  return Math.max(2,cs);
}
function renderCanvas(){
  if(!S.beadGrid)return;
  D.canvasEmpty.style.display='none';D.beadCanvas.style.display='block';D.canvasSection.classList.add('has-grid');
  const canvas=D.beadCanvas,gw=S.gridW,gh=S.gridH;
  const cs=getCellSize();
  // Integer cell size + buffer == CSS display size => browser performs ZERO scaling.
  // Any fractional mismatch forces the browser to resample pixels, which blends the
  // dark grid lines into bead colors and shifts/muddies colors (the "black" bug).
  const MAX_DIM=8192;
  const maxCs=Math.floor(MAX_DIM/Math.max(gw,gh));
  const renderCs=Math.max(2,Math.min(Math.round(cs*S.zoom),maxCs));
  const tw=gw*renderCs,th=gh*renderCs;
  canvas.width=tw;canvas.height=th;
  canvas.style.width=tw+'px';
  canvas.style.height=th+'px';
  // Allow canvas to overflow stage (scroll) when zoomed beyond frame, else constrain
  const stageW=D.canvasStage.clientWidth-28,stageH=D.canvasStage.clientHeight-28;
  canvas.style.maxWidth=(tw>stageW||th>stageH)?'none':'100%';
  const ctx=canvas.getContext('2d'),palette=getPalette(S.brand);
  // Use pure neutral background so bead colors stay true (no warm-beige tint).
  // Dark mode uses a dark neutral; light mode uses pure white.
  const isDarkMode=document.body.dataset.theme==='dark';
  ctx.fillStyle=isDarkMode?'#141418':'#ffffff';ctx.fillRect(0,0,tw,th);

  const gap=S.showBeads?0:Math.max(0,Math.min(1.5,renderCs*0.06));
  for(let gy=0;gy<gh;gy++)for(let gx=0;gx<gw;gx++){
    const bi=S.beadGrid[gy][gx],bead=palette[bi];if(!bead)continue;
    const rgb=hexToRgb(bead.hex);if(!rgb)continue;
    if(S.highlightedColor>=0&&bi!==S.highlightedColor)ctx.globalAlpha=.22;
    if(S.showBeads){
      const cx=gx*renderCs+renderCs/2,cy=gy*renderCs+renderCs/2,r=renderCs/2-Math.max(.4,renderCs*.04);
      ctx.beginPath();ctx.arc(cx,cy+.6,r,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,.07)';ctx.fill();
      const g=ctx.createRadialGradient(cx-r*.35,cy-r*.35,r*.1,cx,cy,r);
      g.addColorStop(0,lighten(rgb,42));g.addColorStop(.55,bead.hex);g.addColorStop(1,darken(rgb,16));
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(cx-r*.32,cy-r*.36,r*.2,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.45)';ctx.fill();
    }else{
      ctx.fillStyle=bead.hex;
      ctx.fillRect(gx*renderCs+gap,gy*renderCs+gap,renderCs-gap,renderCs-gap);
    }
    ctx.globalAlpha=1;
  }
  if(S.showGrid&&!S.showBeads&&renderCs>=5){
    ctx.strokeStyle='rgba(0,0,0,.04)';ctx.lineWidth=renderCs>=12?0.5:0.3;
    for(let gx=0;gx<=gw;gx++){ctx.beginPath();ctx.moveTo(gx*renderCs,0);ctx.lineTo(gx*renderCs,th);ctx.stroke();}
    for(let gy=0;gy<=gh;gy++){ctx.beginPath();ctx.moveTo(0,gy*renderCs);ctx.lineTo(tw,gy*renderCs);ctx.stroke();}
  }
  if(S.showSymbols&&renderCs>=6){
    ctx.textAlign='center';ctx.textBaseline='middle';
    for(let gy=0;gy<gh;gy++)for(let gx=0;gx<gw;gx++){
      const bi=S.beadGrid[gy][gx],bead=palette[bi];if(!bead)continue;
      const rgb=hexToRgb(bead.hex);if(!rgb)continue;
      const isWhite=bead.hex==='#F1F1F1'||bead.hex==='#ECEDED'||bead.hex==='#FFFFFF'||bead.hex==='#EFEFEF'||bead.hex==='#fff'||bead.hex==='#FFF';
      if(isWhite)continue;
      const dark=isDark(rgb);
      // Plain flat text: no bold, no outline — shrink to fit cell
      let fs=Math.max(8,Math.round(renderCs/2.3));
      let txt=bead.code;
      ctx.font=`${fs}px Arial`;
      let tm=ctx.measureText(txt),maxW=renderCs*0.92;
      if(tm.width>maxW){fs=Math.max(6,Math.floor(fs*maxW/tm.width));ctx.font=`${fs}px Arial`;}
      ctx.fillStyle=dark?'#ffffff':'#000000';
      ctx.fillText(txt,gx*renderCs+renderCs/2,gy*renderCs+renderCs/2+0.5);
    }
  }
}

// COLOR LIST

function updateColorList(){
  const cs=D.colorScroll;cs.innerHTML='';
  if(!S.beadColors.length){cs.innerHTML='<div style="padding:20px;color:var(--text3);font-size:11px;white-space:nowrap">上传图片后自动生成</div>';D.editBar.classList.remove('show');return;}

  // Color chips
  for(let i=0;i<S.beadColors.length;i++){

    chip.addEventListener('click',()=>{S.highlightedColor=S.highlightedColor===i?-1:i;S.editColorIdx=i;renderCanvas();updateColorList();});

// EDITING
// =============================================
function getCanvasCell(ex,ey){
  const c=D.beadCanvas;
  if(!c.width||!c.height)return null;
  const rect=c.getBoundingClientRect();
  // Work directly in buffer pixels so zoom (CSS-scaled buffer) stays correct
  const cellBufX=c.width/S.gridW, cellBufY=c.height/S.gridH;
  const bx=(ex-rect.left)/rect.width*c.width;
  const by=(ey-rect.top)/rect.height*c.height;
  const gx=Math.floor(bx/cellBufX),gy=Math.floor(by/cellBufY);
  if(gx<0||gx>=S.gridW||gy<0||gy>=S.gridH)return null;
  return{gx,gy};
}
function nearestWhiteIdx(){
  const palette=getPalette(S.brand);let best=0,bd=Infinity;
  for(let i=0;i<palette.length;i++){const c=hexToRgb(palette[i].hex);if(!c)continue;const d=colorDist(c,{r:255,g:255,b:255});if(d<bd){bd=d;best=i;}}
  return best;
}
function bucketFill(gx,gy,target,replace){
  if(target===replace)return;
  const st=[[gx,gy]],W=S.gridW,H=S.gridH;
  while(st.length){const p=st.pop(),x=p[0],y=p[1];
    if(x<0||x>=W||y<0||y>=H||S.beadGrid[y][x]!==target)continue;
    S.beadGrid[y][x]=replace;st.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);}
}
function applyTool(gx,gy){
  if(!S.beadGrid)return;
  const palette=getPalette(S.brand),cur=S.beadGrid[gy][gx];
  if(S.tool==='pick'){
    const code=palette[cur].code,idx=S.beadColors.findIndex(c=>c.code===code);
    if(idx>=0){S.editColorIdx=idx;S.highlightedColor=idx;renderCanvas();updateColorList();}
    return;
  }
  const tb=S.beadColors[S.editColorIdx];if(!tb)return;
  const ti=palette.findIndex(p=>p.code===tb.code);if(ti<0)return;
  if(S.tool==='pen')S.beadGrid[gy][gx]=ti;
  else if(S.tool==='eraser')S.beadGrid[gy][gx]=nearestWhiteIdx();
  else if(S.tool==='bucket')bucketFill(gx,gy,cur,ti);
}
function recalcAfterEdit(){
  const palette=getPalette(S.brand),cnts={};
  for(let gy=0;gy<S.beadGrid.length;gy++)for(let gx=0;gx<S.beadGrid[gy].length;gx++){const bi=S.beadGrid[gy][gx];cnts[bi]=(cnts[bi]||0)+1;}
  S.beadColors=palette.map((c,i)=>({code:c.code,name:c.name,hex:c.hex,count:cnts[i]||0})).filter(c=>c.count>0).sort((a,b)=>b.count-a.count);
}

function exportPNG(){
  if(!S.beadGrid){toast('请先上传图片');return;}
  const MAX=8000;let cs=40;
  if(Math.max(S.gridW,S.gridH)*cs>MAX)cs=Math.floor(MAX/Math.max(S.gridW,S.gridH));
  const pd=28, lp=18, lh=140;
  const ec=document.createElement('canvas');
  const gridX=pd+lp, gridY=pd+lp;
  ec.width=gridX+S.gridW*cs+pd; ec.height=gridY+S.gridH*cs+lh;
  const ctx=ec.getContext('2d');
  // 白底
  ctx.fillStyle='#fff';ctx.fillRect(0,0,ec.width,ec.height);
  // 网格底色
  ctx.fillStyle='#f8f8f8';ctx.fillRect(gridX,gridY,S.gridW*cs,S.gridH*cs);
  // 坐标编号
  ctx.fillStyle='#555';ctx.font='9px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  for(let gx=0;gx<S.gridW;gx++) ctx.fillText(gx+1, gridX+gx*cs+cs/2, gridY-lp/2);
  for(let gy=0;gy<S.gridH;gy++) ctx.fillText(gy+1, gridX-lp/2, gridY+gy*cs+cs/2);
  // 珠子
  const palette=getPalette(S.brand);
  const WHITE=['#F1F1F1','#ECEDED','#FFFFFF','#EFEFEF','#fff','#FFF'];
  for(let gy=0;gy<S.gridH;gy++)for(let gx=0;gx<S.gridW;gx++){
    const bi=S.beadGrid[gy][gx],bead=palette[bi];if(!bead)continue;
    const rgb=hexToRgb(bead.hex);if(!rgb)continue;
    if(S.showBeads){
      const cx=gridX+gx*cs+cs/2,cy=gridY+gy*cs+cs/2,r=cs/2-Math.max(.4,cs*.04);
      ctx.beginPath();ctx.arc(cx,cy+.6,r,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,.07)';ctx.fill();
      const g=ctx.createRadialGradient(cx-r*.35,cy-r*.35,r*.1,cx,cy,r);
      g.addColorStop(0,lighten(rgb,42));g.addColorStop(.55,bead.hex);g.addColorStop(1,darken(rgb,16));
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(cx-r*.32,cy-r*.36,r*.2,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.45)';ctx.fill();
    }else{
      ctx.fillStyle=bead.hex;ctx.fillRect(gridX+gx*cs,gridY+gy*cs,cs,cs);
    }
    if(WHITE.includes(bead.hex)||(rgb.r+rgb.g+rgb.b)/3>238)continue;
    const dark=isDark(rgb);
    let fs=Math.max(8,Math.round(cs/2.3));
    ctx.font=`${fs}px Arial`;
    const maxW=cs*0.92,tm=ctx.measureText(bead.code);
    if(tm.width>maxW){fs=Math.max(7,Math.floor(fs*maxW/tm.width));ctx.font=`${fs}px Arial`;}
    ctx.fillStyle=dark?'#ffffff':'#000000';
    ctx.fillText(bead.code,gridX+gx*cs+cs/2,gridY+gy*cs+cs/2+1);
  }
  // 次级网格线（每 10 格）
  ctx.strokeStyle='#888';ctx.lineWidth=1.5;
  for(let gx=0;gx<=S.gridW;gx+=10){ctx.beginPath();ctx.moveTo(gridX+gx*cs,gridY);ctx.lineTo(gridX+gx*cs,gridY+S.gridH*cs);ctx.stroke();}
  for(let gy=0;gy<=S.gridH;gy+=10){ctx.beginPath();ctx.moveTo(gridX,gridY+gy*cs);ctx.lineTo(gridX+S.gridW*cs,gridY+gy*cs);ctx.stroke();}
  // 普通网格线
  ctx.strokeStyle='#d0d0d0';ctx.lineWidth=0.5;
  for(let gx=0;gx<=S.gridW;gx++){ctx.beginPath();ctx.moveTo(gridX+gx*cs,gridY);ctx.lineTo(gridX+gx*cs,gridY+S.gridH*cs);ctx.stroke();}
  for(let gy=0;gy<=S.gridH;gy++){ctx.beginPath();ctx.moveTo(gridX,gridY+gy*cs);ctx.lineTo(gridX+S.gridW*cs,gridY+gy*cs);ctx.stroke();}
  // 红色外边框
  ctx.strokeStyle='#e53935';ctx.lineWidth=4;ctx.strokeRect(gridX-2,gridY-2,S.gridW*cs+4,S.gridH*cs+4);
  // 底部图例
  const ly=ec.height-lh+18;
  ctx.fillStyle='#fafafa';ctx.fillRect(pd,ly,ec.width-pd*2,lh-26);ctx.strokeStyle='#e5e7eb';ctx.strokeRect(pd,ly,ec.width-pd*2,lh-26);
  ctx.textAlign='left';
  ctx.fillStyle='#333';ctx.font='15px system-ui';ctx.fillText(`豆豆拼豆 ${S.gridW}×${S.gridH} | ${S.brand.toUpperCase()}`,pd+12,ly+20);
  let lx=pd+12,ly2=ly+42;
  for(let i=0;i<Math.min(S.beadColors.length,20);i++){
    const c=S.beadColors[i];ctx.fillStyle=c.hex;ctx.fillRect(lx,ly2,14,14);ctx.strokeStyle='#ccc';ctx.strokeRect(lx,ly2,14,14);
    ctx.fillStyle='#333';ctx.font='12px system-ui';ctx.fillText(c.code,lx+18,ly2+11);
    if(lx+80>ec.width-pd*2){lx=pd+12;ly2+=20;}else{lx+=76;}
  }
  ctx.textAlign='center';
  downloadCanvas(ec,`豆豆拼豆_${S.brand}_${S.gridW}x${S.gridH}.png`);
}

function downloadCanvas(canvas,filename){
  const fire=url=>{
    const a=document.createElement('a');a.download=filename;a.href=url;
    document.body.appendChild(a);a.click();
    setTimeout(()=>{document.body.removeChild(a);if(url.indexOf('blob:')===0)URL.revokeObjectURL(url);},1200);
  };
  try{
    if(canvas.toBlob){
      canvas.toBlob(b=>{
        if(b)fire(URL.createObjectURL(b));
        else fire(canvas.toDataURL('image/png'));
      },'image/png');
      toast('已下载');return;
    }
  }catch(e){}
  fire(canvas.toDataURL('image/png'));toast('已下载');
}

  // Obvious exit controls shown during preview
  $('#previewExitBtn').addEventListener('click',togglePreview);
  $('#previewExit').addEventListener('click',e=>{if(e.target.id==='previewExit')togglePreview();});
  $('#previewBadge').addEventListener('click',togglePreview);

  // Color list
  $('#btnCopyList').addEventListener('click',()=>{
    if(!S.beadColors.length){toast('暂无数据');return;}
    navigator.clipboard.writeText(S.beadColors.map(c=>`${c.code} ${c.name} (${c.hex}) ×${c.count}颗`).join('\n')).then(()=>toast('已复制色号清单'));
  });

  // Export / Share
  $('#btnExportMain').addEventListener('click',exportPNG);
  $('#btnShare').addEventListener('click',openShare);
  $('#btnShareMain').addEventListener('click',openShare);
  $('#shareBg').addEventListener('click',closeShare);
  $('#shareCancelBtn').addEventListener('click',closeShare);
  $('#shareLink').addEventListener('click',()=>{
    const appUrl='https://355096698c7c4901a0acbaf7b466b967.gz3.agentos-app.net';
    navigator.clipboard.writeText(appUrl).then(()=>toast('程序链接已复制！发给好友即可使用')).catch(()=>toast('请长按地址栏复制链接'));
    closeShare();
  });
  $('#shareSave').addEventListener('click',()=>{genShareImage(ec=>downloadCanvas(ec,`豆豆拼豆_${S.brand}_${S.gridW}x${S.gridH}.png`));closeShare();});
  $('#shareCopy').addEventListener('click',()=>{genShareImage(ec=>{ec.toBlob(blob=>{if(!blob)return;navigator.clipboard.write([new ClipboardItem({'image/png':blob})]).then(()=>toast('图片已复制，可粘贴发送')).catch(()=>toast('复制失败，请用保存图片'));},'image/png');});closeShare();});
  $('#shareNative').addEventListener('click',()=>{genShareImage(ec=>{ec.toBlob(blob=>{if(!blob)return;const f=new File([blob],`豆豆拼豆.png`,{type:'image/png'});if(navigator.share)navigator.share({title:'豆豆拼豆',files:[f]}).catch(()=>{});else{downloadCanvas(ec,'豆豆拼豆.png');}}, 'image/png');});closeShare();});

  // Canvas editing
  let drawing=false;
  function doEdit(ex,ey,start){
    if(document.body.classList.contains('preview-mode'))return null; // no accidental edits while previewing
    if(!S.beadGrid)return null;
    const c=getCanvasCell(ex,ey);if(!c)return null;
    if(start){drawing=true;pushUndo();}
    if(S.tool==='pick'){if(start)applyTool(c.gx,c.gy);return c;}
    if(!drawing)return c;
    if(S.tool==='bucket'&&!start)return c;
    applyTool(c.gx,c.gy);recalcAfterEdit();renderCanvas();updateStats();
    return c;
  }
  D.beadCanvas.addEventListener('mousedown',e=>{if(!S.beadGrid)return;doEdit(e.clientX,e.clientY,true);});
  D.beadCanvas.addEventListener('mousemove',e=>{if(drawing)doEdit(e.clientX,e.clientY,false);});
  D.beadCanvas.addEventListener('mouseup',()=>{drawing=false;updateColorList();});
  D.beadCanvas.addEventListener('mouseleave',()=>{drawing=false;});
  // === TOUCH: drawing with smart scroll-through ===
  // No tool selected → entire canvas area scrolls page. Tool selected → drawing
  // unless touch falls in right-edge 48px dead zone (scroll-through strip).
  function touchInDeadZone(touch){
    const r=D.canvasStage.getBoundingClientRect();
    return touch.clientX > r.right - 48;
  }
  D.beadCanvas.addEventListener('touchstart',e=>{
    if(!S.beadGrid)return;
    // No tool selected → let page scroll, don't start drawing
    if(!S.tool)return;
    // Tool selected but touch in right-edge dead zone → let page scroll
    if(touchInDeadZone(e.touches[0]))return;
    e.preventDefault();
    doEdit(e.touches[0].clientX,e.touches[0].clientY,true);
  });
  D.beadCanvas.addEventListener('touchmove',e=>{
    if(!S.beadGrid||!drawing)return;
    e.preventDefault();
    doEdit(e.touches[0].clientX,e.touches[0].clientY,false);
  });
  D.beadCanvas.addEventListener('touchend',()=>{drawing=false;updateColorList();});

  // ===== PINCH ZOOM (2-finger gesture) =====
  let pinchStartDist=0, pinchStartZoom=1;
  function getTouchDist(e){
    if(e.touches.length<2)return 0;
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    return Math.hypot(dx,dy);
  }
  D.beadCanvas.addEventListener('touchstart',e=>{
    if(e.touches.length===2){pinchStartDist=getTouchDist(e);pinchStartZoom=S.zoom;e.preventDefault();}
  },{passive:false});
  D.beadCanvas.addEventListener('touchmove',e=>{
    if(e.touches.length===2&&pinchStartDist>0){
      e.preventDefault();e.stopPropagation();
      const d=getTouchDist(e);
      const scale=d/pinchStartZoom;
      S.zoom=Math.max(.15,Math.min(3,pinchStartZoom*scale));
      renderCanvas();updatePzLevel();
    }
  },{passive:false});
  D.beadCanvas.addEventListener('touchend',()=>{
    if(pinchStartDist>0){pinchStartDist=0;}
  });

  // Preview zoom buttons
  function updatePzLevel(){const pct=Math.round(S.zoom*100)+'%';const el1=$('#zoomPillVal');const el2=$('#pzLevel');if(el1)el1.textContent=pct;if(el2)el2.textContent=pct;}
  $('#pzIn').addEventListener('click',()=>{S.zoom=Math.min(3,S.zoom+.25);renderCanvas();updatePzLevel();});
  $('#pzOut').addEventListener('click',()=>{S.zoom=Math.max(.15,S.zoom-.25);renderCanvas();updatePzLevel();});
  $('#pzReset').addEventListener('click',()=>{S.zoom=1;renderCanvas();updatePzLevel();});

  // Keyboard
  document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(!S.imageLoaded)return;if(e.key==='+'||e.key==='='){e.preventDefault();S.zoom=Math.min(3,S.zoom+.2);renderCanvas();updatePzLevel();}if(e.key==='-'){e.preventDefault();S.zoom=Math.max(.15,S.zoom-.2);renderCanvas();updatePzLevel();}if(e.key==='0'){e.preventDefault();S.zoom=1;renderCanvas();updatePzLevel();}if((e.ctrlKey||e.metaKey)&&e.key==='e'){e.preventDefault();exportPNG();}if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo();renderCanvas();updateColorList();updateStats();}});

  // Header scroll
  window.addEventListener('scroll',()=>{$('#header').classList.toggle('scrolled',window.scrollY>5);});

  // Theme
  const saved=localStorage.getItem('perler-theme')||'light';
  document.body.dataset.theme=saved;$('#themeToggle').textContent=saved==='light'?'☀':'🌙';
  $('#themeToggle').addEventListener('click',()=>{const n=document.body.dataset.theme==='light'?'dark':'light';document.body.dataset.theme=n;localStorage.setItem('perler-theme',n);$('#themeToggle').textContent=n==='light'?'☀':'🌙';});
}

// =============================================
// INIT
// =============================================
buildPresetRow();
buildSchemePills();
bind();
console.log('🎨 豆豆拼豆 v4 | 手机优先 · 统一页面');
})();
</script>
